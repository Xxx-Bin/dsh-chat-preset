name: Publish

# 发布走 npm Trusted Publishing（OIDC），不依赖 NPM_TOKEN。
# npm 侧需在该包设置中登记 publisher：GitHub 仓库 Xxx-Bin/dsh-chat-preset，
# workflow 文件名 publish.yml。仓库或文件名对不上时认证会失败。
#
# 推 tag 即发布：git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不上传'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # OIDC 身份令牌，Trusted Publishing 的前提

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 自带 npm 10.x，Trusted Publishing 需要 ≥ 11.5.1
      - name: Upgrade npm for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # 本包无第三方依赖、无 lockfile、无构建步骤，故跳过 npm ci / npm run build
      - name: Run tests
        run: node test.mjs

      # tag 与 package.json 版本不一致时直接失败，避免 v1.2.0 发成别的版本
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $tag does not match package.json version $ver"
            exit 1
          fi

      - name: Publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public --provenance
          else
            npm publish --access public --provenance
          fi
        env:
          # 必须显式置空：setup-node 会注入 NODE_AUTH_TOKEN 占位值，非空时会压过 OIDC
          NODE_AUTH_TOKEN: ""
